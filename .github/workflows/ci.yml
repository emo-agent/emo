name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Unit tests ──────────────────────────────────────────────────────────────
  test:
    name: "Test / Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install emo + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -v -s

  # ── Web frontend ─────────────────────────────────────────────────────────────
  web:
    name: "Web / lint + check + build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-ubuntu-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-ubuntu-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Type-check
        working-directory: web
        run: pnpm check

      - name: Build
        working-directory: web
        run: pnpm build

  # ── Installer smoke test (pip method) ───────────────────────────────────────
  install-script-pip:
    name: "Installer (pip) / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Build source tarball (GitHub archive layout)
        run: |
          STAGE="$(mktemp -d)"
          cp -r . "${STAGE}/emo-main"
          rm -rf "${STAGE}/emo-main/.git" "${STAGE}/emo-main/.venv" "${STAGE}/emo-main/__pycache__"
          mkdir -p /tmp/emo-serve
          tar -czf /tmp/emo-serve/main.tar.gz -C "$STAGE" emo-main

      - name: Start local HTTP server
        run: |
          python3 -m http.server 8765 --directory /tmp/emo-serve &
          echo $! > /tmp/http-server.pid
          for i in $(seq 1 20); do curl -sf http://localhost:8765/main.tar.gz -o /dev/null && break || sleep 0.5; done

      - name: Run pip installer
        run: |
          EMO_ARCHIVE_URL=http://localhost:8765/main.tar.gz \
            bash install.sh --method pip --prefix /tmp/emo-pip

      - name: Verify emo binary
        run: /tmp/emo-pip/bin/emo --help

      - name: Simulate curl-pipe install
        run: |
          rm -rf /tmp/emo-pip2
          EMO_ARCHIVE_URL=http://localhost:8765/main.tar.gz \
          EMO_METHOD=pip \
          EMO_PREFIX=/tmp/emo-pip2 \
            bash install.sh
          /tmp/emo-pip2/bin/emo --help

      - name: Stop HTTP server
        if: always()
        run: kill "$(cat /tmp/http-server.pid)" 2>/dev/null || true
