[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emo"
version = "0.1.0"
description = "Lightweight personal AI agent with multi-agent orchestration"
requires-python = ">=3.9"
dependencies = [
    "litellm>=1.40.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
]

[project.scripts]
emo = "emo.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
build = [
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["emo/tests"]

[tool.hatch.build.targets.wheel]
packages = ["emo"]
